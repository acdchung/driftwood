<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Driftwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1e3a4c; --soft:#5f7584; --cream:#fff8ea; --coral:#ff7a59; --gold:#ffc95c; --deep:#0e3a57;
    --outline:0 2px 0 rgba(12,52,78,.6),0 -1px 0 rgba(12,52,78,.35),1px 0 0 rgba(12,52,78,.35),-1px 0 0 rgba(12,52,78,.35),0 4px 16px rgba(6,36,58,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0f3f63;font-family:'Grandstander',ui-rounded,system-ui,sans-serif;color:var(--ink);
    touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  #app canvas{display:block;width:100vw;height:100vh;height:100dvh}
  button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
  svg{display:block}

  /* top HUD: no boxes, text sits on the water */
  #hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}
  .counter{display:flex;align-items:center;gap:8px;color:#fff;text-shadow:var(--outline);font-weight:700;font-size:22px;letter-spacing:.3px}
  .counter svg{width:28px;height:28px;filter:drop-shadow(0 2px 0 rgba(12,52,78,.6)) drop-shadow(0 3px 10px rgba(6,36,58,.4))}
  .counter small{font-size:15px;font-weight:600;opacity:.85}
  .counter.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
  .icons{display:flex;gap:10px}
  .iconbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;
    background:rgba(255,248,234,.18);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 4px 14px rgba(6,36,58,.25);transition:transform .15s}
  .iconbtn:active{transform:scale(.9)}
  .iconbtn svg{width:24px;height:24px;filter:drop-shadow(0 1px 0 rgba(12,52,78,.5))}

  /* text that lives in the world */
  #fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .ft{position:absolute;left:0;top:0;color:#fff;text-shadow:var(--outline);font-weight:700;font-size:19px;white-space:nowrap;will-change:transform,opacity;text-align:center}
  .ft.small{font-size:15px;font-weight:600}
  .ft.gold{color:#ffe08a}
  .ft.big{font-size:24px;font-weight:800}
  .ft.soft{color:rgba(255,255,255,.92);font-weight:600;font-size:16px}
  .ft .ic{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:4px;filter:drop-shadow(0 1px 0 rgba(12,52,78,.6))}
  .ft .ic svg{width:18px;height:18px}
  .place .nm{font-size:36px;font-weight:800;letter-spacing:.4px;line-height:1}
  .place .nm span{display:inline-block;animation:letter .6s cubic-bezier(.3,1.7,.5,1) both}
  .place .sb{font-size:16px;font-weight:500;margin-top:6px;opacity:.95;animation:fadeup .6s .35s both}
  @keyframes letter{from{opacity:0;transform:translateY(14px) scale(.5) rotate(-8deg)}to{opacity:1;transform:none}}
  @keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* cast button */
  #castBtn{position:fixed;right:22px;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 24px);width:86px;height:86px;border-radius:50%;
    background:var(--cream);color:#e8613f;font-size:20px;font-weight:800;letter-spacing:.3px;
    box-shadow:0 0 0 5px rgba(255,122,89,.85),0 10px 24px rgba(6,36,58,.35),inset 0 -5px 0 rgba(30,58,76,.08);
    z-index:6;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .2s;display:grid;place-items:center}
  #castBtn:active{transform:scale(.92)}
  #actBtn{position:fixed;right:22px;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 24px);min-width:86px;height:86px;padding:0 14px;border-radius:43px;
    background:var(--cream);color:#2f7f8f;font-size:18px;font-weight:800;box-shadow:0 0 0 5px rgba(95,179,166,.9),0 10px 24px rgba(6,36,58,.35),inset 0 -5px 0 rgba(30,58,76,.08);
    z-index:6;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .2s,right .25s;display:grid;place-items:center;white-space:nowrap}
  #actBtn.shift{right:124px}
  #actBtn.hidden{transform:scale(0);opacity:0;pointer-events:none}
  #actBtn:active{transform:scale(.92)}
  #fade{position:fixed;inset:0;background:#0b2236;opacity:0;pointer-events:none;z-index:15;transition:opacity .9s}
  #fade.on{opacity:1}
  .shopnote{background:#fff1e6;color:#b4532f;border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px;line-height:1.35}
  #castBtn.hidden{transform:scale(0) rotate(-30deg);opacity:0;pointer-events:none}
  #castBtn.pulse{animation:pulse 1.8s ease-in-out infinite}
  #castBtn.reelin{color:var(--soft);font-size:16px;box-shadow:0 0 0 5px rgba(255,255,255,.55),0 10px 24px rgba(6,36,58,.35)}
  #castBtn.hook{background:var(--gold);color:#7a4a05;box-shadow:0 0 0 5px #fff,0 10px 24px rgba(6,36,58,.35)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 5px rgba(255,122,89,.85),0 10px 24px rgba(6,36,58,.35),0 0 0 5px rgba(255,122,89,.5)}
    50%{box-shadow:0 0 0 5px rgba(255,122,89,.85),0 10px 24px rgba(6,36,58,.35),0 0 0 22px rgba(255,122,89,0)}}

  /* hook ring follows the bobber */
  #reel{position:fixed;left:0;top:0;width:170px;height:170px;pointer-events:none;z-index:6;transition:opacity .15s}
  #reel.hidden{opacity:0}
  #reel .target{position:absolute;left:50%;top:50%;border-radius:50%;border-style:solid;opacity:.85;
    box-shadow:0 0 0 2px rgba(255,255,255,.7),inset 0 0 0 2px rgba(255,255,255,.7)}
  #reel .ring{position:absolute;inset:0;border-radius:50%;border:5px solid #fff;box-shadow:0 0 14px rgba(255,255,255,.8)}
  #reel .bang{position:absolute;left:50%;top:-12px;transform:translate(-50%,-100%);font-size:26px;font-weight:800;color:#fff;text-shadow:var(--outline)}

  /* catch reveal: no card, just the fish */
  #catch{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
    background:radial-gradient(circle at 50% 45%,rgba(255,236,190,.38),rgba(255,236,190,0) 46%);transition:opacity .3s}
  #catch.hidden{opacity:0;pointer-events:none}
  #catch .rays{position:absolute;left:50%;top:45%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
    background:repeating-conic-gradient(rgba(255,244,214,.22) 0 9deg,rgba(255,244,214,0) 9deg 22deg);
    -webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #catch .art{position:relative;width:min(200px,52vw);animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(6,36,58,.3))}
  #catch .art svg{width:100%;height:auto}
  #catch:not(.hidden) .art{animation:popin .55s cubic-bezier(.3,1.7,.5,1),floaty 2.4s .55s ease-in-out infinite}
  @keyframes popin{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  #catch .tier{position:relative;margin-top:14px;font-size:15px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;text-shadow:var(--outline)}
  #catch .tier.exotic{animation:hue 2.5s linear infinite}
  @keyframes hue{to{filter:hue-rotate(360deg)}}
  #catch .nm{position:relative;font-size:38px;font-weight:800;line-height:1.05;margin-top:4px;text-shadow:var(--outline);padding:0 20px}
  #catch .meta{position:relative;margin-top:10px;font-size:17px;font-weight:600;text-shadow:var(--outline);display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap}
  #catch .meta .hl{color:#ffe08a;display:inline-flex;align-items:center;gap:4px}
  #catch .meta svg{width:17px;height:17px}
  #catch .meta .worth{display:inline-flex;align-items:center;gap:3px;color:#ffd2bd} #catch .meta .worth svg{width:19px;height:19px}
  #catch .meta .mdl{display:inline-block;vertical-align:-2px} #catch .meta .note{color:#ffd0c4}

  /* journal: a menu, so it keeps a surface */
  #mapv{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(8,36,56,.4);transition:opacity .25s;padding:calc(max(14px,env(safe-area-inset-top)) + 72px) 0 max(24px,env(safe-area-inset-bottom))}
  #mapv.hidden{opacity:0;pointer-events:none}
  #mapv .panel{width:min(560px,94vw);padding:16px 16px 18px;background:var(--cream);border-radius:22px;box-shadow:0 20px 50px rgba(6,36,58,.35),inset 0 0 0 3px #f1e3c5}
  #mapv header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  #mapv h2{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px}
  #mapv h2 svg{width:26px;height:26px;color:#3f8fb0}
  #mapv h2 small{font-size:15px;font-weight:600;color:var(--soft)}
  #mapv .close{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f1e3c5}
  #mapv .close svg{width:20px;height:20px}
  #mapc{width:min(100%,calc(100dvh - 210px));aspect-ratio:1;display:block;margin:0 auto;border-radius:16px}
  #journal{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(8,36,56,.4);transition:opacity .25s;padding:calc(max(14px,env(safe-area-inset-top)) + 72px) 0 max(24px,env(safe-area-inset-bottom))}
  #journal.hidden{opacity:0;pointer-events:none}
  #journal .panel{width:min(560px,92vw);max-height:100%;overflow:auto;padding:18px 18px 20px;background:var(--cream);border-radius:22px;
    box-shadow:0 20px 50px rgba(6,36,58,.35),inset 0 0 0 3px #f1e3c5}
  #journal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  #journal h2{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink)}
  #journal h2 svg{width:26px;height:26px;color:#e8613f}
  #journal h2 small{font-size:15px;font-weight:600;color:var(--soft)}
  #journal .close{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f1e3c5;color:var(--ink)}
  #journal .close svg{width:20px;height:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .slot{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;box-shadow:0 2px 0 #efe2c6}
  .slot svg{height:44px;margin:0 auto}
  .slot .n{font-weight:700;font-size:14px;margin-top:4px}
  .slot .d{font-size:11.5px;color:var(--soft);margin-top:3px}
  .slot.unknown .n{color:#a7b4bc}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:4px;letter-spacing:.6px;text-transform:uppercase}


  .stats{display:flex;flex-direction:column;gap:0}
  .counter.shells{font-size:19px} .counter.shells svg{color:#ffd2bd;width:25px;height:25px}
  .counter.tick{animation:bump .35s cubic-bezier(.3,1.8,.5,1)}
  .iconbtn{position:relative}
  .badge{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--ink);font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;box-shadow:0 2px 6px rgba(6,36,58,.3);white-space:nowrap;text-shadow:none}
  .badge.full{background:var(--coral);color:#fff}
  .sheet{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(8,36,56,.4);transition:opacity .25s;padding:calc(max(14px,env(safe-area-inset-top)) + 72px) 0 max(24px,env(safe-area-inset-bottom))}
  .sheet.hidden{opacity:0;pointer-events:none}
  .sheet .panel{width:min(560px,92vw);max-height:100%;overflow:auto;padding:18px 18px 20px;background:var(--cream);border-radius:22px;box-shadow:0 20px 50px rgba(6,36,58,.35),inset 0 0 0 3px #f1e3c5}
  .sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .sheet h2{margin:0;font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sheet h2 svg{width:26px;height:26px;color:#e8613f}
  .sheet .close{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f1e3c5}
  .sheet .close svg{width:20px;height:20px}
  .tabs{display:flex;gap:4px;background:#f1e3c5;padding:4px;border-radius:999px;margin-bottom:14px}
  .tabs button{flex:1;padding:9px 0;border-radius:999px;font-weight:700;font-size:15px;color:var(--soft)}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 #e6d4ae}
  .row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 12px;margin-bottom:8px;box-shadow:0 2px 0 #efe2c6;transition:opacity .25s,transform .25s}
  .row.gone{opacity:0;transform:translateX(30px)}
  .row .f{width:54px;flex:none} .row .f svg{width:54px;height:auto}
  .row .t{flex:1;min-width:0} .row .t b{display:block;font-size:15px} .row .t span{font-size:12px;color:var(--soft)}
  .price{display:inline-flex;align-items:center;gap:3px;font-weight:800;color:#c4643f;white-space:nowrap} .price svg{width:17px;height:17px;color:#f2a283}
  .btn{background:var(--coral);color:#fff;font-weight:800;border-radius:999px;padding:9px 14px;font-size:15px;display:inline-flex;align-items:center;gap:5px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);white-space:nowrap}
  .btn svg{width:16px;height:16px}
  .btn.big{width:100%;justify-content:center;padding:14px;font-size:18px;margin-top:6px}
  .btn.poor{background:#eadfca;color:#a39881;box-shadow:none}
  .btn.ghost{background:#f1e3c5;color:var(--ink);box-shadow:none}
  .btn.shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .empty{text-align:center;color:var(--soft);padding:26px 10px;font-size:15px;line-height:1.4}
  .cap{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-weight:700;color:var(--soft);font-size:14px}
  .gear{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;box-shadow:0 2px 0 #efe2c6}
  .gear .ic{width:44px;height:44px;border-radius:12px;background:#ffe9df;color:#e8613f;display:grid;place-items:center;flex:none} .gear .ic svg{width:24px;height:24px}
  .gear .t{flex:1;min-width:0} .gear .t b{font-size:16px} .gear .t span{display:block;font-size:12.5px;color:var(--soft)}
  .pips{display:flex;gap:4px;margin-top:6px} .pips i{width:20px;height:6px;border-radius:3px;background:#eadfca} .pips i.on{background:#ff9a6b}
  h3.sec{margin:6px 2px 8px;font-size:13px;color:var(--soft);font-weight:800;text-transform:uppercase;letter-spacing:1.2px}
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:14px}
  .sw{background:#fff;border-radius:14px;padding:10px 4px 8px;text-align:center;box-shadow:0 2px 0 #efe2c6;border:2.5px solid transparent;font-size:13px;font-weight:700;position:relative}
  .sw.on{border-color:var(--coral)}
  .sw .chip{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 0 0 2px #fff,0 0 0 3px #eadfca;background-size:cover}
  .sw small{display:flex;justify-content:center;align-items:center;gap:3px;font-size:11.5px;color:var(--soft);font-weight:700;margin-top:3px}
  .sw small svg{width:13px;height:13px}
  .sw.locked .chip{filter:grayscale(1) opacity(.4)}
  .sw .eq{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center} .sw .eq svg{width:12px;height:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px} .chips span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;gap:4px;align-items:center} .chips svg{width:12px;height:12px}
  .slot{position:relative;cursor:pointer} .slot .m{position:absolute;top:7px;right:7px;width:20px;height:20px}
  .slot:active{transform:scale(.97)}
  #jlist.hidden,#jdetail.hidden{display:none}
  .detail{text-align:center}
  .detail .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--soft);font-size:15px;margin-bottom:4px;float:left}
  .detail .back svg{width:18px;height:18px}
  .detail .art{clear:both;padding-top:6px} .detail .art svg{width:min(210px,58vw);height:auto;margin:0 auto;filter:drop-shadow(0 6px 8px rgba(30,58,76,.15))}
  .detail h3{margin:8px 0 2px;font-size:28px;font-weight:800}
  .detail p.flav{color:var(--soft);font-size:15px;margin:10px 8px 14px;line-height:1.4}
  .stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
  .stats4 div{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 0 #efe2c6} .stats4 small{display:block;font-size:11.5px;color:var(--soft);font-weight:700}
  .stats4 b{font-size:17px;display:flex;align-items:center;gap:4px} .stats4 b svg{width:17px;height:17px}
  .sizebar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,#eadfca 0 50%,#e5b48a 50% 75%,#cfd8de 75% 92%,#ffd772 92%);margin:18px 6px 6px}
  .sizebar i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--coral);border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .sizelbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft);margin:0 4px 4px;font-weight:600}

  .counter.time{order:3;font-size:14px;font-weight:600;gap:6px;opacity:.95} .counter.time svg{width:18px;height:18px;filter:drop-shadow(0 1px 0 rgba(12,52,78,.6))}
  .stats .counter.shells{order:2} .stats #counter{order:1}
  #jnotes.hidden{display:none}
  .note{background:#fffdf6;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 0 #efe2c6;font-size:15px;line-height:1.45;color:#4a3b2c;position:relative}
  .note.unk{color:#b9ad97;text-align:center}
  .note small{display:block;margin-top:6px;font-size:12px;color:#a8977a;font-weight:600}
  .tmap{display:grid;grid-template-columns:1fr 1fr;width:min(240px,64vw);aspect-ratio:1;margin:4px auto;border-radius:12px;overflow:hidden;box-shadow:0 0 0 3px #e9d6ad}
  .tmap div{background:#f3e2bd;display:grid;place-items:center;font-size:26px;font-weight:800;color:#d8c296;overflow:hidden;position:relative}
  .tmap div svg{position:absolute;width:200%;height:200%}
  #catch .paper{position:relative;margin-top:14px;max-width:min(330px,84vw);background:#fffdf6;color:#4a3b2c;border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.45;box-shadow:0 10px 30px rgba(6,36,58,.35);text-shadow:none;transform:rotate(-1.5deg)}
  #catch .paper small{display:block;margin-top:8px;font-size:12.5px;color:#a8977a;font-weight:600}
  #joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);
    pointer-events:none;z-index:4;opacity:0;transition:opacity .15s}
  #joy.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,248,234,.9);box-shadow:0 4px 12px rgba(6,36,58,.3)}

  #start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(8,36,56,.15),rgba(8,36,56,.55));transition:opacity .6s}
  #start.hidden{opacity:0;pointer-events:none}
  #start .inner{width:min(360px,88vw);text-align:center;color:#fff}
  #start .mark{width:74px;height:74px;margin:0 auto 6px;border-radius:24px;display:grid;place-items:center;background:var(--coral);
    box-shadow:0 0 0 5px rgba(255,255,255,.85),0 12px 30px rgba(6,36,58,.4);transform:rotate(-6deg)}

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------------------------------------------------------------- helpers
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(11);
const R = (a,b)=>a+rand()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d}
const $=id=>document.getElementById(id);
const isTouch = matchMedia('(pointer:coarse)').matches;

function waveH(x,z,t){return 0.12*Math.sin(x*0.18+t*1.1)+0.08*Math.sin(z*0.23+t*1.4)+0.05*Math.sin((x+z)*0.35+t*2.0)}

// ---------------------------------------------------------------- renderer
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
}catch(e){
  $('err').style.display='grid'; $('err').textContent='This game needs WebGL, which is not available in this browser.'; throw e;
}
const DPR = Math.min(window.devicePixelRatio||1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
$('app').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0f3f63');
const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 5, 600);

// post-processing: render to target, then tilt-shift blur + vignette
const dbs = new THREE.Vector2();
renderer.getDrawingBufferSize(dbs);
const rt = new THREE.WebGLRenderTarget(dbs.x, dbs.y, {samples:4, type:THREE.HalfFloatType});
const postMat = new THREE.ShaderMaterial({
  uniforms:{tDiffuse:{value:rt.texture}, uRes:{value:dbs.clone()}, uBlur:{value:1}, uNight:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform vec2 uRes;uniform float uBlur;uniform float uNight;varying vec2 vUv;
    void main(){
      float d=abs(vUv.y-0.5);
      float amt=smoothstep(0.13,0.5,d);
      float rad=amt*uBlur;
      vec2 px=1.0/uRes;
      vec3 col=texture2D(tDiffuse,vUv).rgb;float w=1.0;
      if(rad>0.4){
        for(int i=0;i<14;i++){float fi=float(i);float a=fi*2.39996;float r=sqrt((fi+0.5)/14.0)*rad;
          col+=texture2D(tDiffuse,vUv+vec2(cos(a),sin(a))*r*px).rgb;w+=1.0;}
      }
      col/=w;
      vec2 q=vUv-0.5;col*=1.0-dot(q,q)*(0.45+uNight*0.5);
      col=mix(col,col*vec3(0.85,0.95,1.18),uNight*0.6);
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  depthTest:false, depthWrite:false
});
const triGeo = new THREE.BufferGeometry();
triGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1,-1,0, 3,-1,0, -1,3,0],3));
triGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 2,0, 0,2],2));
const postQuad = new THREE.Mesh(triGeo, postMat); postQuad.frustumCulled=false;
const postScene = new THREE.Scene(); postScene.add(postQuad);
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
function setBlur(){ postMat.uniforms.uBlur.value = dbs.y/1000*7; }
setBlur();

// ---------------------------------------------------------------- lights
const hemi=new THREE.HemisphereLight('#d9efff','#f3d4a2',1.5); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff0d6', 2.7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:1,far:160});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.04;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(-28,46,-20);

// ---------------------------------------------------------------- materials / builders
const matCache = {};
function mat(color, o={}){
  const k = color+JSON.stringify(o);
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial({color, roughness:.88, metalness:0, flatShading:true, ...o}));
}
function mesh(geo, color, o={}, shadow=true){
  const m = new THREE.Mesh(geo, mat(color,o)); m.castShadow=shadow; m.receiveShadow=true; return m;
}
function softTex(){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.45,'rgba(255,255,255,.75)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const SOFT = softTex();

// ---------------------------------------------------------------- islands
// Every island is a union of round "blobs", so shapes can be crescents, chains, twins…
// `solid` circles block the boat but have no sand (stilts, wrecks, arches).
function ring(n,rad,a0,a1,r){ const out=[]; for(let i=0;i<n;i++){ const a=lerp(a0,a1,i/(n-1)); out.push([Math.sin(a)*rad,-Math.cos(a)*rad,r*(i%2?1:.9)]); } return out; }
const ISLANDS = [
  {id:'home',   name:'Home Harbour', sub:'your little hut',               x:0,    z:0,    blobs:[[0,0,15],[11,-10,9],[-11,8,8],[-4,-12,7]], grass:true, labelY:9},
  {id:'cove',   name:'Palm Cove',    sub:'a sheltered lagoon',            x:78,   z:-52,  blobs:ring(9,14,-1.95,1.95,5.4), grass:true, labelY:9},
  {id:'lantern',name:'Lantern Isle', sub:'the old lighthouse',            x:38,   z:92,   blobs:[[0,0,11],[9,6,7],[-8,-5,7],[2,-10,5]], grass:true, labelY:15},
  {id:'coral',  name:'Coral Rest',   sub:'a quiet sandbar',               x:-82,  z:-58,  blobs:[[0,0,9],[8,-4,6],[-6,5,5]], grass:true, labelY:8},
  {id:'twins',  name:'Twin Keys',    sub:'held together by a rope bridge',x:-72,  z:58,   blobs:[[-14,0,9],[-19,6,5],[15,2,9],[20,-4,5]], grass:true, labelY:11},
  {id:'peak',   name:'Mossy Peak',   sub:'the tallest hill around',       x:-165, z:-12,  blobs:[[0,0,20],[16,10,11],[-14,13,10],[6,-16,10],[-15,-8,8]], grass:true, labelY:17},
  {id:'village',name:'Stilt Village',sub:'houses on the water',           x:122,  z:36,   blobs:[], labelY:9},
  {id:'wreck',  name:'Shipwreck Shoal',sub:'what happened here?',         x:152,  z:-112, blobs:[[0,0,6],[7,3,4]], labelY:6},
  {id:'turtle', name:'Turtle Rock',  sub:'it looks familiar',             x:-128, z:98,   blobs:[[0,0,6.5]], labelY:5},
  {id:'pebble', name:'Pebble Key',   sub:'mostly rocks',                  x:16,   z:-118, blobs:[[0,0,6],[5,3,3.5]], labelY:5},
  {id:'far',    name:'Far Reef',     sub:'someone left a chest…',         x:218,  z:46,   blobs:[[0,0,7],[-5,5,4]], labelY:7},
  {id:'flower', name:'Flower Isle',  sub:'it smells lovely',              x:-32,  z:162,  blobs:[[0,0,10],[8,6,6],[-8,4,5]], grass:true, labelY:9},
  {id:'sandbar',name:'Sunset Sandbar',sub:'a long walk to nowhere',       x:118,  z:162,  blobs:[[-15,2,4],[-7.5,0,4.6],[0,-1,5],[7.5,1,4.6],[15,0,4]], labelY:6},
  {id:'arch',   name:null, x:42,  z:-26,  blobs:[]},
  {id:'stacks', name:null, x:-42, z:-112, blobs:[]},
];
const ISL={}; ISLANDS.forEach(I=>{ ISL[I.id]=I; I.solid=[]; });
const SAND_K=0.11, SAND_Y=-0.22;
const FLAMES=[], FLAGS=[], BOBBERS=[], NPCS=[];
// walking: COLLIDE = circles you can't walk through, PLATS = flat decks, RAMPS = stairs/bridges/boardwalks, INTERACT = things to use
const COLLIDE=[], PLATS=[], RAMPS=[], INTERACT=[];
function addPlat(x,z,hw,hd,rot,y){ PLATS.push({x,z,hw,hd,rot,y,c:Math.cos(rot),s:Math.sin(rot)}); }
function addRamp(ax,az,ay,bx,bz,by,w){ RAMPS.push({ax,az,ay,bx,bz,by,w,dx:bx-ax,dz:bz-az,L2:(bx-ax)**2+(bz-az)**2}); }
function rampAt(x,z){ let best=null; for(const r of RAMPS){ const u=clamp(((x-r.ax)*r.dx+(z-r.az)*r.dz)/r.L2,0,1); const px=r.ax+r.dx*u, pz=r.az+r.dz*u; if(Math.hypot(x-px,z-pz)<=r.w/2){ const y=lerp(r.ay,r.by,u); if(best===null||y>best) best=y; } } return best; }
function platAt(x,z){ let best=null; for(const p of PLATS){ const dx=x-p.x, dz=z-p.z; const lx=dx*p.c-dz*p.s, lz=dx*p.s+dz*p.c; if(Math.abs(lx)<=p.hw&&Math.abs(lz)<=p.hd&&(best===null||p.y>best)) best=p.y; } return best; }
function nearRamp(x,z,pad){ for(const r of RAMPS){ const u=clamp(((x-r.ax)*r.dx+(z-r.az)*r.dz)/r.L2,0,1); if(Math.hypot(x-(r.ax+r.dx*u),z-(r.az+r.dz*u))<r.w/2+pad) return true; } return false; }
const SAND=[], SOLID=[], HILLS=[];
for(const I of ISLANDS) for(const [dx,dz,r] of I.blobs){
  const b={x:I.x+dx,z:I.z+dz,r,grass:!!I.grass&&r>=5,I}; b.gy=SAND_K*r*0.62+SAND_Y-0.05; SAND.push(b);
}
function addSolid(I,x,z,r){ const s={x,z,r,I}; SOLID.push(s); I.solid.push(s); return s; }
function groundH(x,z){
  let h=-1;
  for(const b of SAND){ const p=Math.hypot(x-b.x,z-b.z); if(p>=b.r) continue;
    h=Math.max(h,SAND_K*Math.sqrt(b.r*b.r-p*p)+SAND_Y);
    if(b.grass){ const gr=b.r*.6; if(p<gr) h=Math.max(h,b.gy+.15*Math.sqrt(gr*gr-p*p)); } }
  for(const hl of HILLS){ if(Math.hypot(x-hl.x,z-hl.z)<hl.r) h=Math.max(h,hl.top); }
  return h-0.04;
}
function shoreDist(x,z){ let d=1e9; for(const b of SAND) d=Math.min(d,Math.hypot(x-b.x,z-b.z)-b.r); for(const s of SOLID) d=Math.min(d,Math.hypot(x-s.x,z-s.z)-s.r); return d; }
function islandDist(I,x,z){ let d=1e9; for(const b of SAND) if(b.I===I) d=Math.min(d,Math.hypot(x-b.x,z-b.z)-b.r); for(const s of I.solid) d=Math.min(d,Math.hypot(x-s.x,z-s.z)-s.r); return d; }
function put(I,lx,lz,obj,ry=R(0,Math.PI*2)){ const x=I.x+lx,z=I.z+lz; obj.position.set(x,groundH(x,z),z); obj.rotation.y=ry; scene.add(obj); if(obj.userData.col) COLLIDE.push({x,z,r:obj.userData.col}); return obj; }

function frondGeo(){
  const L=2.7, W=0.62, n=8, geo=new THREE.PlaneGeometry(1,1,2,n), p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const u=p.getX(i)+.5, v=p.getY(i)+.5;
    const w = W*Math.min(1,v*3.5+.25)*(1-v*.85);
    p.setXYZ(i,(u-.5)*w*2, -1.05*v*v + Math.abs(u-.5)*.22, v*L);
  }
  geo.computeVertexNormals(); return geo;
}
const FROND = frondGeo();
function palm(h=4.6, lean=1){
  const g=new THREE.Group(), segs=6; let x=0,y=0;
  for(let i=0;i<segs;i++){
    const t=i/segs, sh=h/segs, nx=lean*Math.pow((i+1)/segs,2)*1.4;
    const s=mesh(new THREE.CylinderGeometry(.16-.05*t,.2-.05*t,sh*1.08,7), i%2?'#a97c4d':'#8f663f');
    s.position.set((x+nx)/2, y+sh/2, 0); s.rotation.z=-Math.atan2(nx-x,sh); g.add(s); x=nx; y+=sh;
  }
  const top=new THREE.Group(); top.position.set(x,y,0); g.add(top);
  for(let i=0;i<8;i++){
    const f=new THREE.Mesh(FROND, mat(i%2?'#7cc546':'#62ad38',{side:THREE.DoubleSide}));
    f.castShadow=true; f.rotation.order='YXZ'; f.rotation.set(-.35+R(-.15,.15), i/8*Math.PI*2+R(-.2,.2), 0); top.add(f);
  }
  for(let i=0;i<3;i++){ const c=mesh(new THREE.IcosahedronGeometry(.17,0),'#6b4a2b'); c.position.set(Math.cos(i*2.1)*.22,-.2,Math.sin(i*2.1)*.22); top.add(c); }
  g.userData.col=.45; return g;
}

  for(let i=0;i<3;i++){ const c=mesh(new THREE.ConeGeometry(h*(.34-i*.08),h*.42,7), i%2?'#3f8f5a':'#4a9c62'); c.position.y=h*(.38+i*.2); g.add(c); }

function blossom(h=3.4,col='#ffb3c7'){

  for(let i=0;i<4;i++){ const c=mesh(new THREE.IcosahedronGeometry(R(.8,1.15),0),i%2?col:'#ffc7d6'); c.position.set(R(-.6,.6),h*.75+R(0,.6),R(-.6,.6)); g.add(c); }

function bush(s=1, flowers=true){
  const g=new THREE.Group(); const cols=['#5fae4a','#6dbb52','#56a243'];
  for(let i=0;i<3;i++){ const b=mesh(new THREE.IcosahedronGeometry(R(.45,.75)*s,0),cols[i]); b.position.set(R(-.5,.5)*s,R(.25,.5)*s,R(-.5,.5)*s); g.add(b); }
  if(flowers) for(let i=0;i<4;i++){ const f=mesh(new THREE.IcosahedronGeometry(.11*s,0), rand()<.5?'#ff8fb1':'#fff1a8',{},false); f.position.set(R(-.7,.7)*s,R(.6,.95)*s,R(-.7,.7)*s); g.add(f); }
  return g;
}
function rock(s=1,c='#bdb6aa'){ const r=mesh(new THREE.DodecahedronGeometry(s,0),c); r.scale.set(R(.9,1.3),R(.55,.8),R(.9,1.2)); r.position.y=s*.2; const g=new THREE.Group(); g.add(r); g.userData.col=s*.95; return g; }
function crate(s=.8){ const g=new THREE.Group(); const b=mesh(new THREE.BoxGeometry(s,s,s),'#b98550'); b.position.y=s/2; g.add(b); const band=mesh(new THREE.BoxGeometry(s*1.02,s*.14,s*1.02),'#8f6238'); band.position.y=s/2; g.add(band); g.userData.col=s*.7; return g; }
function campfire(){
  const g=new THREE.Group();
  for(let i=0;i<6;i++){ const st=mesh(new THREE.DodecahedronGeometry(.22,0),'#a49c90'); const a=i/6*Math.PI*2; st.position.set(Math.cos(a)*.6,.08,Math.sin(a)*.6); g.add(st); }
  for(let i=0;i<3;i++){ const l=mesh(new THREE.CylinderGeometry(.08,.08,.9,5),'#7a5434'); l.rotation.z=Math.PI/2; l.rotation.y=i*1.05; l.position.y=.12; g.add(l); }
  const fl=new THREE.Mesh(new THREE.ConeGeometry(.28,.7,6),new THREE.MeshBasicMaterial({color:'#ffb347'})); fl.position.y=.45; g.add(fl);
  const fl2=new THREE.Mesh(new THREE.ConeGeometry(.16,.45,6),new THREE.MeshBasicMaterial({color:'#fff1a8'})); fl2.position.y=.38; g.add(fl2);
  FLAMES.push(fl,fl2); g.userData.col=.75; return g;

function tent(col='#ff8a5c'){
  const g=new THREE.Group(); const t=mesh(new THREE.ConeGeometry(1.3,1.8,4),col); t.rotation.y=Math.PI/4; t.scale.z=1.4; t.position.y=.9; g.add(t);
  const d=mesh(new THREE.ConeGeometry(.5,1.0,3),'#5a3e2b'); d.position.set(0,.5,1.05); d.scale.z=.3; g.add(d); g.userData.col=1.3; return g;
}
function hill(x,z,r,h,top='#8fca62',side='#cdb894',stairA=null){
  const base=groundH(x,z)-.35;
  const geo=new THREE.CylinderGeometry(r*.88,r,h,14,2), p=geo.attributes.position;
  for(let i=0;i<p.count;i++){ const px=p.getX(i),pz=p.getZ(i),a=Math.atan2(pz,px),k=1+.07*Math.sin(a*5+x)+.05*Math.sin(a*8+z); p.setX(i,px*k); p.setZ(i,pz*k); }
  geo.computeVertexNormals();
  const m=mesh(geo,side); m.position.set(x,base+h/2,z); scene.add(m);
  const cap=mesh(new THREE.CylinderGeometry(r*.9,r*.9,.3,14),top,{},false); cap.position.set(x,base+h+.05,z);
  const cp=cap.geometry.attributes.position; for(let i=0;i<cp.count;i++){ const px=cp.getX(i),pz=cp.getZ(i),a=Math.atan2(pz,px),k=1+.07*Math.sin(a*5+x)+.05*Math.sin(a*8+z); cp.setX(i,px*k); cp.setZ(i,pz*k); }
  cap.geometry.computeVertexNormals(); scene.add(cap);
  const topY=base+h+.2;
  if(stairA!==null){
    const dx=Math.sin(stairA), dz=Math.cos(stairA), run=h*1.1;
    const sx=x+dx*(r+run), sz=z+dz*(r+run), sy=groundH(sx,sz)+.05, ex=x+dx*(r*.8), ez=z+dz*(r*.8);
    const n=Math.max(4,Math.ceil((topY-sy)/.32)), L=Math.hypot(ex-sx,ez-sz);
    for(let i=0;i<n;i++){ const u=(i+.5)/n; const st=mesh(new THREE.BoxGeometry(1.9,(topY-sy)/n*(i+1)+.3,L/n+.02),'#d8cdb6');
      st.position.set(lerp(sx,ex,u),sy+((topY-sy)/n*(i+1)+.3)/2-.3,lerp(sz,ez,u)); st.rotation.y=stairA; scene.add(st); }
    addRamp(sx,sz,sy,ex,ez,topY,1.8);
  }
  HILLS.push({x,z,r:r*.82,R:r*1.02,top:topY}); return topY;
}
function person(coat='#ffc93f',hat='#ffc93f',skin='#f2c39b'){
  const g=new THREE.Group(), body=new THREE.Group(); g.add(body);
  const hm=hat.isMaterial?hat:new THREE.MeshStandardMaterial({color:hat,roughness:.8});
  const c=new THREE.Mesh(new THREE.CapsuleGeometry(.27,.42,4,10),mat(coat,{flatShading:false})); c.position.y=.48; c.castShadow=true; body.add(c);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.24,14,10),mat(skin,{flatShading:false})); h.position.y=1.05; h.castShadow=true; body.add(h);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,.16,12),hm); b.position.y=1.24; b.castShadow=true; body.add(b);
  const t=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8,0,Math.PI*2,0,Math.PI/2),hm); t.position.y=1.28; body.add(t);
  const eyes=new THREE.Group(); for(const sx of [-.08,.08]){ const e=new THREE.Mesh(new THREE.SphereGeometry(.03,6,4),mat('#1d2b36')); e.position.set(sx,1.07,.22); eyes.add(e); } body.add(eyes);
  const feet=[-.12,.12].map(sx=>{ const f=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),mat('#6b4a33')); f.scale.set(1,.6,1.4); f.position.set(sx,.05,0); f.castShadow=true; g.add(f); return f; });
  g.userData={body,feet,col:.4}; return g;
}
function hullGeo(L=3.4,W=1.7,H=.8){
  const hg=new THREE.BoxGeometry(W,H,L,2,2,6), p=hg.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i); const t=(z+L/2)/L;
    let s = t>.55 ? 1-Math.pow((t-.55)/.45,1.6)*.94 : 1-(.55-t)*.18;
    if(y<0) s*=.62; if(y>0) y+=Math.pow(t,3)*H*.44;
    p.setXYZ(i,x*s,y,z);
  }
  hg.computeVertexNormals(); return hg;
}

// sand + grass mounds
for(const b of SAND){

const GLOW_POS=[];
// ---- bake all static scenery into a few big meshes (one per material per area) so phones stay smooth
(function(){
  const keep=new Set([ISL.lantern.lamp,...FLAMES,...FLAGS]); BOBBERS.forEach(b=>b.traverse(o=>keep.add(o))); NPCS.forEach(b=>b.traverse(o=>keep.add(o)));
  scene.updateMatrixWorld(true);
  const buckets=new Map(), victims=[];
  scene.traverse(o=>{
    if(!o.isMesh||o.isInstancedMesh||keep.has(o)||!(o.material instanceof THREE.MeshStandardMaterial)) return;
    const wp=new THREE.Vector3().setFromMatrixPosition(o.matrixWorld);
    if(o.material.emissive&&o.material.emissive.getHex()!==0) GLOW_POS.push(wp.clone());
    const key=o.material.uuid+'|'+(o.castShadow?1:0)+'|'+Math.floor(wp.x/70)+','+Math.floor(wp.z/70);
    let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    for(const a of Object.keys(g.attributes)) if(a!=='position'&&a!=='normal') g.deleteAttribute(a);
    if(!g.attributes.normal) g.computeVertexNormals();
    g.applyMatrix4(o.matrixWorld);
    if(!buckets.has(key)) buckets.set(key,{mat:o.material,cast:o.castShadow,geos:[]});
    buckets.get(key).geos.push(g); victims.push(o);
  });
  for(const o of victims) o.parent.remove(o);
  for(const {mat,cast,geos} of buckets.values()){ const m=new THREE.Mesh(mergeGeometries(geos),mat); m.castShadow=cast; m.receiveShadow=true; scene.add(m); }
})();

const islandUniform = Array.from({length:24},()=>new THREE.Vector3(9999,9999,0));
const WATER_SIZE=320, WATER_SEG=160;
const waterGeo = new THREE.PlaneGeometry(WATER_SIZE,WATER_SIZE,WATER_SEG,WATER_SEG); waterGeo.rotateX(-Math.PI/2);
const waterMat = new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}, uIsl:{value:islandUniform}, uTint:{value:new THREE.Vector3(1,1,1)}, uNight:{value:0}},
  vertexShader:`
    uniform float uTime; varying vec3 vW;
    float wave(vec2 p,float t){return 0.12*sin(p.x*0.18+t*1.1)+0.08*sin(p.y*0.23+t*1.4)+0.05*sin((p.x+p.y)*0.35+t*2.0);}
    void main(){vec4 w=modelMatrix*vec4(position,1.0);w.y+=wave(w.xz,uTime);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`
    uniform float uTime; uniform vec3 uIsl[24]; uniform vec3 uTint; uniform float uNight; varying vec3 vW;
    vec3 lin(vec3 c){return pow(c,vec3(2.2));}
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    vec3 pal(float h){
      if(h<0.2) return vec3(1.0,0.56,0.64);
      if(h<0.4) return vec3(0.71,0.55,1.0);
      if(h<0.6) return vec3(1.0,0.70,0.42);
      if(h<0.8) return vec3(0.44,0.83,0.76);
      return vec3(0.98,0.42,0.57);
    }
    void main(){
      float d=1e4;
      for(int i=0;i<24;i++){vec3 I=uIsl[i];d=min(d,length(vW.xz-I.xy)-I.z);}
      float n=noise(vW.xz*0.12);
      float dd=d+(n-0.5)*6.0;
      vec3 deep=lin(vec3(0.07,0.29,0.47)), mid=lin(vec3(0.10,0.50,0.64)), shal=lin(vec3(0.36,0.80,0.78)), sandy=lin(vec3(0.74,0.91,0.80));
      vec3 col=mix(deep,mid,smoothstep(32.0,9.0,dd));
      col=mix(col,shal,smoothstep(9.0,2.0,dd));
      col=mix(col,sandy,smoothstep(2.6,0.1,d)*0.75);
      col*=0.9+0.2*noise(vW.xz*0.035+3.0);

      // coral & seaweed patches in the shallows
      vec2 g=vW.xz/1.6; vec2 gi=floor(g); float cor=0.0; vec3 cc=vec3(0.0);
      for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
        vec2 c=gi+vec2(float(x),float(y)); float h=hash(c);
        vec2 pt=c+vec2(hash(c+3.1),hash(c+7.7)); float r=0.22+0.42*hash(c+1.3);
        float m=smoothstep(r,r-0.14,length(g-pt))*step(0.55,h);
        if(m>cor){cor=m;cc=pal(hash(c+9.2));}
      }
      float zone=smoothstep(7.5,3.5,d+(n-0.5)*4.0)*smoothstep(0.8,2.6,d);
      col=mix(col,lin(cc)*0.8,cor*zone*0.6);

      // caustics
      vec2 p=vW.xz*0.42; float t=uTime*0.55;
      float c=sin(p.x+sin(p.y*1.3+t))*sin(p.y*1.1+sin(p.x*0.9-t*0.8)+t*0.3);
      c=pow(1.0-abs(c),12.0);
      col+=lin(vec3(0.92,1.0,1.0))*c*(0.015+0.12*smoothstep(10.0,0.0,d));

      // sparkle
      float sp=pow(noise(vW.xz*1.7+vec2(uTime*0.6,-uTime*0.5))*noise(vW.xz*2.3-vec2(uTime*0.4,uTime*0.3)),9.0);
      col+=vec3(1.0)*sp*0.7;

      // shoreline foam
      float wob=(noise(vW.xz*0.9+uTime*0.35)-0.5)*0.9;
      float fd=d+wob;
      float foam=smoothstep(0.85,0.35,fd)*smoothstep(-0.7,-0.05,fd);
      float ph=fract(uTime*0.2); float ringD=abs(fd-(0.5+ph*3.0));
      foam+=smoothstep(0.24,0.0,ringD)*(1.0-ph)*0.75;
      col=mix(col,lin(vec3(1.0,0.99,0.95)),clamp(foam,0.0,1.0)*0.9);
      col*=uTint; col+=vec3(0.75,0.85,1.0)*sp*uNight*1.4;
      gl_FragColor=vec4(col,1.0);
    }`
});

{ const idx=[]; for(let i=0;i<TRAIL_N-1;i++){ const a=i*2,b=a+1,c=a+2,d=a+3; idx.push(a,b,c,b,d,c); } trailGeo.setIndex(idx); }
const trailMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTint:{value:new THREE.Vector3(1,1,1)}},
  vertexShader:`attribute vec3 aInfo; varying vec3 vI; varying vec3 vW; void main(){ vI=aInfo; vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform vec3 uTint; varying vec3 vI; varying vec3 vW;
    float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
    void main(){
      float side=abs(vI.x*2.0-1.0), age=vI.y, str=vI.z;
      float edge=smoothstep(0.45,0.95,side)*(1.0-smoothstep(0.95,1.0,side));
      float mid=0.22*(1.0-side);
      float n=noise(vW.xz*1.6)*0.6+noise(vW.xz*4.0)*0.4;
      float a=(edge*0.95+mid)*pow(1.0-age,1.5)*str;
      a*=smoothstep(0.25+age*0.45,0.65+age*0.3,n+0.35);
      gl_FragColor=vec4(mix(uTint,vec3(1.0),0.35),clamp(a,0.0,0.9));
    }`});
const trailMesh=new THREE.Mesh(trailGeo,trailMat); trailMesh.frustumCulled=false; trailMesh.renderOrder=2; scene.add(trailMesh);

  const eye='#1d2b36';
  if(f.shape==='boot') return `<svg viewBox="0 0 100 60"><path d="M30 6h22v28h26a12 12 0 0 1 12 12v6H30z" fill="${c}"/><rect x="28" y="49" width="64" height="7" rx="3" fill="${unknown?'#b5c1c8':'#3f3129'}"/>${unknown?'':'<path d="M34 14h14M34 20h14" stroke="#5e4637" stroke-width="2.5" stroke-linecap="round"/>'}</svg>`;

function tagHTML(tier){ const T=TIERS[tier]; return `<span class="tag" style="background:${T.bg};color:${T.fg}">${tier}</span>`; }
function updateCount(){ const n=Object.keys(save.caught).length; $('count').textContent=n; $('countOf').textContent='/ '+FISH.length; $('jcount').textContent=`${n} of ${FISH.length}`; }
function renderJournal(){
  $('jtiers').innerHTML=['Common','Rare','Epic','Legendary','Exotic'].map(t=>{ const all=tierFish(t), n=all.filter(f=>save.caught[f.id]).length, T=TIERS[t];
    return `<span style="background:${T.bg};color:${T.fg}">${n===all.length?ICON2.check_fill:''}${t} ${n}/${all.length}</span>`; }).join('');
  $('jgrid').innerHTML=FISH.map(f=>{ const c=save.caught[f.id];
    const hint=(f.where==='deep'?'Open water':f.where==='shallow'?'Near islands':'Anywhere')+(f.time==='night'?' · night':'');
    return `<div class="slot ${c?'':'unknown'}" data-id="${f.id}">${c?medalSVG(medalOf(f,c.best)):''}${fishSVG(f,!c)}<div class="n">${c?f.name:'???'}</div>${tagHTML(f.tier)}<div class="d">${c?`best ${f.shape==='boot'?'—':c.best+' cm'} · ×${c.n}`:hint}</div></div>`; }).join('');
  $('jdetail').classList.add('hidden'); $('jlist').classList.remove('hidden');
  if(typeof showJTab==='function'){ jTab='fish'; showJTab(); }
}
function toggleJournal(show){ const j=$('journal'); const on= show!==undefined?show:j.classList.contains('hidden'); if(on){renderJournal(); j.classList.remove('hidden');} else j.classList.add('hidden'); }
$('journalBtn').onclick=()=>toggleJournal(true);
$('closeJ').onclick=()=>toggleJournal(false);
$('journal').addEventListener('pointerdown',e=>{ if(e.target.id==='journal') toggleJournal(false); });

save.shells=save.shells||0; save.cooler=save.cooler||[]; save.up=save.up||{}; save.owned=save.owned||{}; save.equip=save.equip||{hull:'clay',sail:'canvas',hat:'yellow'};
const lvl=id=>save.up[id]||0;
const coolerCap=()=>UPGRADES[4].caps[lvl('cooler')];
function sizeNorm(f,size){ const [a,b]=f.size; return clamp((size-a)/Math.max(1,b-a),0,1); }
function priceOf(f,size,perfect){ return Math.max(1,Math.round(BASE_PRICE[f.tier]*(.75+.6*sizeNorm(f,size))*(perfect?1.15:1))); }
const MEDALS=[['gold',.92,'#f2b632'],['silver',.75,'#aab7c2'],['bronze',.5,'#d08a4f']];
function medalOf(f,size){ if(f.shape==='boot') return null; const n=sizeNorm(f,size); for(const m of MEDALS) if(n>=m[1]) return m; return null; }
function medalSVG(m,cls='m'){ return m?`<span class="${cls}" style="color:${m[2]}">${ICON2.medal_fill}</span>`:''; }
const tierFish=t=>FISH.filter(f=>f.tier===t);
const tierDone=t=>tierFish(t).every(f=>save.caught[f.id]);
function isOwned(kind,it){ return it.cost===0&&!it.unlock || save.owned[kind+':'+it.id] || (it.unlock==='Treasure'?!!save.treasure:(it.unlock&&tierDone(it.unlock))); }
let shellsShown=save.shells;
function updateWallet(){ $('coolerBadge').textContent=`${save.cooler.length}/${coolerCap()}`; $('coolerBadge').classList.toggle('full',save.cooler.length>=coolerCap()); }
function shellTick(dt){ if(shellsShown!==save.shells){ const d=save.shells-shellsShown; shellsShown+=Math.sign(d)*Math.max(1,Math.ceil(Math.abs(d)*Math.min(1,dt*6))); if(Math.abs(save.shells-shellsShown)<1) shellsShown=save.shells; } $('shells').textContent=Math.round(shellsShown); }

// sail pattern textures
function sailTex(it){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=208; const g=cv.getContext('2d');
  g.fillStyle='#fff6e6'; g.fillRect(0,0,128,208);
  if(it.pat==='stripes'){ g.fillStyle=it.c; for(let y=14;y<208;y+=44) g.fillRect(0,y,128,20); }
  if(it.pat==='dots'){ g.fillStyle=it.c; for(let r=0,y=14;y<208;y+=26,r++) for(let x=(r%2)*13+8;x<128;x+=26){ g.beginPath(); g.arc(x,y,7,0,7); g.fill(); } }
  if(it.pat==='sun'){ const gr=g.createRadialGradient(10,198,4,10,198,200); gr.addColorStop(0,'#ffd36b'); gr.addColorStop(.45,'#ffa36b'); gr.addColorStop(1,'#fff6e6'); g.fillStyle=gr; g.fillRect(0,0,128,208);
    g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=5; for(let i=0;i<7;i++){ const a=-Math.PI/2+i*Math.PI/12; g.beginPath(); g.moveTo(10,198); g.lineTo(10+Math.cos(a)*260,198+Math.sin(a)*260); g.stroke(); } }
  if(it.pat==='treasure'){ const gr=g.createLinearGradient(0,0,0,208); gr.addColorStop(0,'#ffe9a3'); gr.addColorStop(1,'#e0a93a'); g.fillStyle=gr; g.fillRect(0,0,128,208); g.fillStyle='#fffbe8'; for(let i=0;i<14;i++){ const x=(i*47)%120+4, y=(i*71)%200+4; g.beginPath(); for(let k=0;k<10;k++){ const a=k/10*Math.PI*2, r=k%2?2.5:6; g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } g.fill(); } }
  if(it.pat==='rainbow'){ const cs=['#ff6b6b','#ffa94d','#ffd43b','#69db7c','#4dabf7','#9775fa']; cs.forEach((c,i)=>{ g.fillStyle=c; g.fillRect(0,i*208/6,128,208/6+1); }); }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.repeat.set(1/1.65,1/2.7); return t;
}
function chipCSS(kind,it){
  if(kind!=='sail') return `background:${it.color}`;
  if(it.pat==='plain') return 'background:#fff6e6';
  if(it.pat==='stripes') return `background:repeating-linear-gradient(0deg,#fff6e6 0 7px,${it.c} 7px 14px)`;
  if(it.pat==='dots') return `background:radial-gradient(${it.c} 28%,transparent 32%) 0 0/11px 11px,#fff6e6`;
  if(it.pat==='sun') return 'background:radial-gradient(circle at 10% 95%,#ffd36b,#ffa36b 45%,#fff6e6)';
  if(it.pat==='treasure') return 'background:radial-gradient(#fffbe8 18%,transparent 22%) 0 0/12px 12px,linear-gradient(#ffe9a3,#e0a93a)';
  return 'background:linear-gradient(#ff6b6b,#ffa94d,#ffd43b,#69db7c,#4dabf7,#9775fa)';
}
function applyStyle(){
  const h=STYLES.hull.find(x=>x.id===save.equip.hull)||STYLES.hull[0]; boat.hullMat.color.set(h.color);
  const st=STYLES.sail.find(x=>x.id===save.equip.sail)||STYLES.sail[0]; if(boat.sailMat.map) boat.sailMat.map.dispose(); boat.sailMat.map=sailTex(st); boat.sailMat.needsUpdate=true;
  const ht=STYLES.hat.find(x=>x.id===save.equip.hat)||STYLES.hat[0]; boat.hatMat.color.set(ht.color); boat.hatMat.emissive.set(ht.glow?'#ffb300':'#000000'); boat.hatMat.emissiveIntensity=ht.glow?.6:0;
}
applyStyle();

// trading post panel
let shopTab='sell';
function renderShop(){
  document.querySelectorAll('#stabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===shopTab));
  const body=$('sbody'); const sh=ICON2.shell;
  const note=walker.shop?'':`<div class="shopnote">You can browse from anywhere, but to sell and buy you'll need to visit a Trading Post: Home Harbour or Stilt Village.</div>`;
  if(shopTab==='sell'){
    const items=save.cooler.map((c,i)=>({...c,f:FISH.find(f=>f.id===c.id),i})).filter(x=>x.f);
    const total=items.reduce((s,x)=>s+priceOf(x.f,x.size,x.perfect),0);
    body.innerHTML=note+`<div class="cap"><span>Cooler</span><span>${items.length} / ${coolerCap()}</span></div>`+
      (items.length? items.map(x=>`<div class="row" data-i="${x.i}"><div class="f">${fishSVG(x.f,false)}</div><div class="t"><b>${x.f.name}</b><span>${x.f.shape==='boot'?'a boot':x.size+' cm'}${x.perfect?' · perfect':''}</span></div>${medalSVG(medalOf(x.f,x.size),'medal')}<span class="price">${sh}${priceOf(x.f,x.size,x.perfect)}</span></div>`).join('')
        +`<button class="btn big" id="sellAll">Sell all<span class="price" style="color:#fff">${sh}${total}</span></button>`
      : `<div class="empty">Your cooler is empty.<br>Go catch something!</div>`);
    const b=$('sellAll'); if(b) b.onclick=sellAll;
  } else if(shopTab==='gear'){
    body.innerHTML=note+UPGRADES.map(u=>{ const l=lvl(u.id), max=l>=u.costs.length, cost=u.costs[l];
      const extra=u.id==='cooler'?` · holds ${u.caps[l]}${max?'':' → '+u.caps[l+1]}`:'';
      return `<div class="gear"><div class="ic">${ICON2[u.icon]}</div><div class="t"><b>${u.name}</b><span>${u.desc}${extra}</span><div class="pips">${u.costs.map((_,i)=>`<i class="${i<l?'on':''}"></i>`).join('')}</div></div>
        ${max?`<button class="btn ghost" disabled>${ICON2.check_fill}Max</button>`:`<button class="btn ${save.shells<cost?'poor':''}" data-up="${u.id}">${sh}${cost}</button>`}</div>`; }).join('');
    body.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.up,b));
  } else {
    body.innerHTML=Object.keys(STYLES).map(kind=>`<h3 class="sec">${STYLE_LABEL[kind]}</h3><div class="swatches">`+STYLES[kind].map(it=>{
      const own=isOwned(kind,it), on=save.equip[kind]===it.id, locked=it.unlock&&!own;
      const sub= on?'Wearing': own?'Owned': locked?`${ICON2.lock_fill}${it.unlock==='Treasure'?'find treasure':'all '+it.unlock}`:`${sh}${it.cost}`;
      return `<button class="sw ${on?'on':''} ${locked?'locked':''}" data-k="${kind}" data-id="${it.id}">${on?`<span class="eq">${ICON2.check_fill}</span>`:''}<div class="chip" style="${chipCSS(kind,it)}"></div>${it.name}<small>${sub}</small></button>`; }).join('')+'</div>').join('');
    body.querySelectorAll('.sw').forEach(b=>b.onclick=()=>pickStyle(b.dataset.k,b.dataset.id,b));
  }
}
function sellAll(){
  if(!walker.shop){ sfx.miss(); return; }
  const items=save.cooler.map(c=>({...c,f:FISH.find(f=>f.id===c.id)})).filter(x=>x.f); if(!items.length) return;

let ac=null, master=null, muted=false, rush=null;
function initAudio(){
  if(ac){ if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.7; master.connect(ac.destination);
    // ocean bed: brown noise, low-passed, slowly swelling
    const len=ac.sampleRate*4, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520;
    const g=ac.createGain(); g.gain.value=.16; const lfo=ac.createOscillator(); lfo.frequency.value=.11; const lg=ac.createGain(); lg.gain.value=.09;
    lfo.connect(lg); lg.connect(g.gain); src.connect(lp); lp.connect(g); g.connect(master); src.start(); lfo.start();
    // rush of water + wind that follows boat speed
    const wn=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate), wd=wn.getChannelData(0); for(let i=0;i<wd.length;i++) wd[i]=Math.random()*2-1;
    const ws=ac.createBufferSource(); ws.buffer=wn; ws.loop=true; const wf=ac.createBiquadFilter(); wf.type='bandpass'; wf.Q.value=.7; wf.frequency.value=400;
    const wg=ac.createGain(); wg.gain.value=0; ws.connect(wf); wf.connect(wg); wg.connect(master); ws.start(); rush={g:wg,f:wf};
  }catch(e){ ac=null; }
}
function tone(f,dur,{type='sine',vol=.18,to=null,delay=0}={}){
  if(!ac) return; const t=ac.currentTime+delay; const o=ac.createOscillator(), g=ac.createGain();

  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05);
}
function noiseBurst(dur=.35,freq=1400,vol=.25){
  if(!ac) return; const t=ac.currentTime; const len=ac.sampleRate*dur, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=ac.createBufferSource(); s.buffer=b; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=.8;
  const g=ac.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(master); s.start(t);
}

function updateUI(dt){
  // floating messages
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=dt; const p=f.t/f.dur;
    if(p>=1){ f.el.remove(); floats.splice(i,1); continue; }
    _pv.copy(f.pos); _pv.y+=f.rise*(1-Math.pow(1-p,3)); const s=toScreen(_pv);
    placeEl(f.el,s,0,f.dy); f.el.style.opacity= p<.12? p/.12 : p>.7? (1-p)/.3 : 1; }
  // island name
  // island name: pinned above the island, fades in only when you're close to its shore
  let nearI=null, nd=1e9;
  const fp=walker.on?walker.pos:boat.pos; for(const I of namedIslands){ const d=islandDist(I,fp.x,fp.z); if(d<nd){nd=d;nearI=I;} }
  const want = started ? clamp(1-(nd-5)/9,0,1) : 0;          // full within ~5 of the shore, gone by ~14
  if(nearI!==placeI && placeLbl.op<.02 && want>0) showPlace(nearI);
  if(placeLbl.op<.02 && want===0) placeI=null;                // so the letters animate again next visit
  placeLbl.op=damp(placeLbl.op, nearI===placeI?want:0, 5, dt);
  if(placeI){ const s=toScreen(new THREE.Vector3(placeI.x,placeI.labelY||5,placeI.z));
    placeLbl.el.style.transform=`translate(${s.x}px,${s.y}px) translate(-50%,-100%)`; }
  placeLbl.el.style.opacity=placeLbl.op;
  if(placeI && placeLbl.op>.5 && !save.visited[placeI.id]){ save.visited[placeI.id]=1; persist(); }
  // move hint under the boat until you've sailed a bit
  if(started && !hintStart) hintStart=boat.pos.clone();
  const moved=hintStart? boat.pos.distanceTo(hintStart)>9 : false;
  moveHint.op=damp(moveHint.op,started&&!moved&&!walker.on?1:0,3,dt);
  if(moveHint.op>.01){ const s=toScreen(boat.pos); placeEl(moveHint.el,s,0,64); } moveHint.el.style.opacity=moveHint.op;
  // point out the nearest ripples until the first cast
  let tip=null; if(started&&!hasCast&&moved&&!walker.on){ let bd=40; for(const sp of spots){ if(sp.cd>0) continue; const d=sp.pos.distanceTo(boat.pos); if(d<bd){bd=d;tip=sp;} } }
  spotHint.op=damp(spotHint.op,tip?1:0,3,dt);
  if(tip) spotHint.last=tip;
  if(spotHint.last){ const s=toScreen(new THREE.Vector3(spotHint.last.pos.x,1.2,spotHint.last.pos.z)); placeEl(spotHint.el,s,0,-6+Math.sin(time*2.5)*3); }
  spotHint.el.style.opacity=spotHint.op;

  if(fish.state==='bite'||fish.state==='between'){ const s=toScreen(fish.bob); $('reel').style.transform=`translate(${s.x-85}px,${s.y-85}px)`; }
}

function drawMap(){
  const c=$('mapc'), css=c.clientWidth||400, dpr=Math.min(2,devicePixelRatio||1); c.width=c.height=css*dpr;
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const sc=css/(WORLD_R*2+24), cx=css/2, X=x=>cx+x*sc, Z=z=>cx+z*sc;
  const bg=g.createRadialGradient(cx,cx,0,cx,cx,css*.7); bg.addColorStop(0,'#2f8db3'); bg.addColorStop(1,'#14567d'); g.fillStyle=bg; g.fillRect(0,0,css,css);
  g.strokeStyle='rgba(255,255,255,.12)'; g.lineWidth=1; for(let i=1;i<6;i++){ g.beginPath(); g.arc(cx,cx,i*css/12,0,Math.PI*2); g.stroke(); }
  g.fillStyle='rgba(120,220,210,.35)'; for(const b of SAND){ g.beginPath(); g.arc(X(b.x),Z(b.z),(b.r+6)*sc,0,Math.PI*2); g.fill(); }
  g.fillStyle='#f3dcaa'; for(const b of SAND){ g.beginPath(); g.arc(X(b.x),Z(b.z),b.r*sc,0,Math.PI*2); g.fill(); }
  g.fillStyle='#8fca62'; for(const b of SAND) if(b.grass){ g.beginPath(); g.arc(X(b.x),Z(b.z),b.r*.6*sc,0,Math.PI*2); g.fill(); }
  g.fillStyle='#c9bfae'; for(const s of SOLID){ g.beginPath(); g.arc(X(s.x),Z(s.z),Math.max(1.5,s.r*sc*.8),0,Math.PI*2); g.fill(); }
  g.fillStyle='rgba(255,255,255,.75)'; for(const G of GUSTS) if(G.cd<=0){ g.beginPath(); g.arc(X(G.pos.x),Z(G.pos.z),1.6,0,Math.PI*2); g.fill(); }
  if(piecesFound()===4&&!save.treasure){ const tx=X(TREASURE_POS.x), tz=Z(TREASURE_POS.z); g.strokeStyle='#e84a3a'; g.lineWidth=3; g.lineCap='round'; g.beginPath(); g.moveTo(tx-5,tz-5); g.lineTo(tx+5,tz+5); g.moveTo(tx+5,tz-5); g.lineTo(tx-5,tz+5); g.stroke(); }
  g.textAlign='center'; g.lineJoin='round';
  let found=0;
  for(const I of namedIslands){ const seen=save.visited[I.id]; if(seen) found++;
    let top=1e9; for(const b of SAND) if(b.I===I) top=Math.min(top,Z(b.z-b.r)); for(const s of I.solid) top=Math.min(top,Z(s.z-s.r)); if(top>1e8) top=Z(I.z);
    g.font=`700 ${seen?12:13}px Grandstander, sans-serif`; const txt=seen?I.name:'?';
    g.lineWidth=3.5; g.strokeStyle='rgba(12,52,78,.75)'; g.strokeText(txt,X(I.x),top-4); g.fillStyle=seen?'#fff':'rgba(255,255,255,.7)'; g.fillText(txt,X(I.x),top-4); }
  $('mcount').textContent=`${found} of ${namedIslands.length} islands`;
  const bx=X(boat.pos.x), bz=Z(boat.pos.z);
  g.save(); g.translate(bx,bz); g.rotate(-boat.heading+Math.PI);
  g.beginPath(); g.moveTo(0,-8); g.lineTo(6,6); g.lineTo(0,3); g.lineTo(-6,6); g.closePath();
  g.fillStyle='#ff7a59'; g.strokeStyle='#fff'; g.lineWidth=2; g.fill(); g.stroke(); g.restore();
  g.beginPath(); g.arc(bx,bz,13,0,Math.PI*2); g.strokeStyle='rgba(255,255,255,.6)'; g.lineWidth=2; g.stroke();
}

function inputVec(){

let nearSpot=null;
function pickSpecies(spot){
  const area=spot.deep?'deep':'shallow', odds={...ODDS[area]}; const bl=lvl('bait'); for(const t in odds){ if(t==='Common') odds[t]*=1-.12*bl; else if(t!=='Junk') odds[t]*=1+.32*bl; }
  const now=isNight()?'night':'day';
  const fits=f=>(f.where==='any'||f.where===area)&&(!f.time||f.time===now);
  const tiers=TIER_ORDER.filter(t=>FISH.some(f=>f.tier===t&&fits(f)));
  let r=Math.random()*tiers.reduce((s,t)=>s+odds[t],0), tier=tiers[0];
  for(const t of tiers){ if((r-=odds[t])<=0){tier=t;break;} }
  const pool=FISH.filter(f=>f.tier===tier&&fits(f));
  return pool[Math.floor(Math.random()*pool.length)];
}
function onAction(){
  if(!started) return;

function cast(){

  const ll=lvl('line'); fish.noBite = Math.random() < (s.deep?.24:.2)*(1-.28*ll);

  fish.dur = fish.noBite ? R(9,13) : (1.2+Math.pow(Math.random(),1.7)*8.5)*(1-.15*ll);
  fish.saidStill=false;
  const toSpot=new THREE.Vector3().subVectors(s.pos,boat.pos); toSpot.y=0;
  const dist=Math.min(toSpot.length(),7.5); toSpot.normalize();
  fish.to.copy(boat.pos).addScaledVector(toSpot,Math.max(dist,3.5)); fish.to.x+=R(-.6,.6); fish.to.z+=R(-.6,.6);
  boat.rod.visible=true; bobber.visible=true; line.visible=true;

function endFishing(){

}
function startHook(){
  const T=TIERS[fish.sp.tier];
  fish.state='bite'; fish.t=0;
  fish.win=T.win*R(.9,1.1);
  fish.mid = T.hooks>1 ? R(.3,.48) : .4;   // multi-hook fish move the band around
  const W=T.width*(1+.13*lvl('rod')); fish.lo=fish.mid-W/2; fish.hi=fish.mid+W/2;
  const D=180*fish.hi, bw=180*(fish.hi-fish.lo)/2;
  Object.assign(reelTarget.style,{width:D+'px',height:D+'px',margin:`${-D/2}px 0 0 ${-D/2}px`,borderWidth:bw+'px',borderColor:T.band});
  reelBang.textContent = T.hooks>1 ? `${fish.hook+1}/${T.hooks}` : '!';
  $('ring').style.transform='scale(1)';
  $('reel').classList.remove('hidden'); setBtn('hook');
}
function judge(){
  const s=1-fish.t/fish.win, T=TIERS[fish.sp.tier];
  if(s>=fish.lo && s<=fish.hi){
    fish.perfectAll = fish.perfectAll && Math.abs(s-fish.mid) < (fish.hi-fish.lo)*.22;
    fish.hook++;
    if(fish.hook<T.hooks){
      fish.state='between'; fish.t=0; $('reel').classList.add('hidden');
      splash(fish.bob,8,.6); sfx.hookHit(fish.hook); say(fish.hook===T.hooks-1?'one more!':'keep going!',fish.bob,{cls:'gold',dur:1,rise:0,dy:125}); 
      return;
    }
    $('reel').classList.add('hidden'); setBtn('hidden');
    fish.state='landing'; fish.t=0; fish.perfect=fish.perfectAll;
    fish.from.copy(fish.bob);
    splash(fish.bob,18+T.rank*6,1.1+T.rank*.15); sfx.reel();
    fish.flyer=makeFlyer(fish.sp); scene.add(fish.flyer);
  } else {
    const early=s>fish.hi;
    endFishing(); sfx.miss();
    const big=T.rank>=2;
    say(early?(big?'it shook loose…':'too early!'):(big?'it broke free!':'it slipped away…'),fish.bob,{dur:1.9});
    splash(fish.bob,6+T.rank*3,.6);

}
function makeFlyer(f){
  const g=new THREE.Group(), prism=f.color==='prism';
  const m = prism ? new THREE.MeshStandardMaterial({color:'#ff8fd1',roughness:.4,emissive:'#552244',flatShading:false}) : null;
  const part=(geo,col)=>{ const x=new THREE.Mesh(geo,m||mat(col,{flatShading:false})); x.castShadow=true; g.add(x); return x; };
  if(f.shape==='boot'){
    part(new THREE.BoxGeometry(.35,.6,.35),f.color).position.y=.1;
    part(new THREE.BoxGeometry(.35,.25,.6),f.color).position.set(0,-.15,.2);
  } else if(f.shape==='ray'){
    const b=part(new THREE.SphereGeometry(.6,12,8),f.color); b.scale.set(1.5,.18,1);
    const t=part(new THREE.CylinderGeometry(.02,.04,1.1,5),f.color); t.rotation.x=Math.PI/2; t.position.z=-1;
  } else if(f.shape==='jelly'){
    const d=part(new THREE.SphereGeometry(.45,14,8,0,Math.PI*2,0,Math.PI/2),f.color); d.material=new THREE.MeshStandardMaterial({color:f.color,emissive:f.color,emissiveIntensity:.5,transparent:true,opacity:.85});
    for(let i=0;i<5;i++){ const tt=part(new THREE.CylinderGeometry(.025,.02,.8,4),f.color); const a=i/5*Math.PI*2; tt.position.set(Math.cos(a)*.25,-.4,Math.sin(a)*.25); }
  } else if(f.shape==='squid'){
    const bd=part(new THREE.ConeGeometry(.3,1.1,8),f.color); bd.rotation.x=Math.PI/2; bd.position.z=.2;
    for(let i=0;i<6;i++){ const tt=part(new THREE.CylinderGeometry(.04,.02,.7,4),f.color); tt.rotation.x=Math.PI/2; const a=i/6*Math.PI*2; tt.position.set(Math.cos(a)*.15,Math.sin(a)*.15,-.65); }
  } else if(f.shape==='eel'){
    for(let i=0;i<6;i++){ const s=part(new THREE.SphereGeometry(.22-i*.02,10,8),f.color); s.position.set(Math.sin(i*1.1)*.15,0,.6-i*.3); }
  } else {
    const round=f.shape==='round'||f.shape==='angler';
    const body=part(new THREE.SphereGeometry(.35,12,8),f.color); body.scale.set(round?.9:.55,round?.85:.7,round?1:1.25);
    const tail=part(new THREE.ConeGeometry(.28,.45,4),f.color); tail.rotation.x=-Math.PI/2; tail.scale.x=.25; tail.position.z=-.55;
    if(f.fin){ const fin=part(new THREE.ConeGeometry(.3,.6,3),f.color); fin.scale.z=.2; fin.position.y=.35; }
    if(f.bill){ const bl=part(new THREE.ConeGeometry(.06,.9,5),f.color); bl.rotation.x=Math.PI/2; bl.position.z=.85; }
    if(f.shape==='angler'){ const l=new THREE.Mesh(new THREE.SphereGeometry(.1,8,6),new THREE.MeshBasicMaterial({color:'#bff7ff'})); l.position.set(0,.55,.45); g.add(l); }

}
function landCatch(){

function updateFishing(dt,t){
  if(fish.state==='idle') return;
  fish.t+=dt;
  boat.tip.getWorldPosition(tipW);
  const T=TIERS[fish.sp.tier];
  const tx=(fish.state==='casting'?fish.to:fish.bob);
  const la=Math.atan2(tx.x-boat.pos.x,tx.z-boat.pos.z)-boat.heading;
  boat.ch.rotation.y=damp(boat.ch.rotation.y,angDiff(0,la),8,dt);
  let rodTilt=1.0;
  const thrash=.05+T.rank*.03;
  if(fish.state==='casting'){
    const p=Math.min(1,fish.t/.55);
    fish.bob.lerpVectors(tipW,fish.to,p); fish.bob.y=lerp(tipW.y,waveH(fish.to.x,fish.to.z,t),p)+Math.sin(p*Math.PI)*2.5;
    rodTilt=lerp(-.4,1.0,Math.min(1,p*2.5));
    if(p>=1){ fish.state='waiting'; fish.t=0; splash(fish.to,6,.5); sfx.plop(); setBtn('reelin'); }
  } else if(fish.state==='waiting'){
    fish.bob.set(fish.to.x,waveH(fish.to.x,fish.to.z,t)+.05,fish.to.z);
    // fake-out nibbles (fewer when nothing is around)
    if(Math.random()<dt*(fish.noBite?.25:.9) && fish.t<fish.dur-.4){ fish.dip=.12+Math.random()*.1; sfx.nibble(); }
    if(fish.t>fish.dur){
      if(fish.noBite){ const at=fish.bob.clone(); fish.spot.cd=10; endFishing(); sfx.miss(); say('nothing\u2019s biting here…',at,{dur:2.6,cls:'small'}); return; }
      fish.hook=0; fish.perfectAll=true; fish.dip=.6; sfx.bite(T.rank); splash(fish.bob,5+T.rank*2,.4);
      if(T.rank>=3) say('something big!',fish.bob,{cls:'gold big',dur:1.5,rise:0,dy:125});
      try{navigator.vibrate&&navigator.vibrate(T.rank>=3?[40,40,60]:40);}catch(_){}
      startHook();
    }
  } else if(fish.state==='bite'){
    fish.bob.set(fish.to.x,waveH(fish.to.x,fish.to.z,t)-.12+Math.sin(t*30)*thrash,fish.to.z);
    const s=1-fish.t/fish.win; $('ring').style.transform=`scale(${Math.max(0,s)})`;
    rodTilt=.85+Math.sin(t*25)*(.04+T.rank*.02);
    if(s<fish.lo-.05) judge();
  } else if(fish.state==='between'){
    fish.bob.set(fish.to.x+Math.sin(t*14)*.25,waveH(fish.to.x,fish.to.z,t)-.1,fish.to.z+Math.cos(t*11)*.25);

  // ---------- wind gusts
  for(const G of GUSTS){
    if(G.cd>0){ G.cd-=dt; if(G.cd<=0){ G.pos.copy(gustSpot()); G.g.position.copy(G.pos); } }
    G.vis=damp(G.vis,G.cd>0?0:1,3,dt);
    const near=Math.abs(G.pos.x-boat.pos.x)<90&&Math.abs(G.pos.z-boat.pos.z)<90; G.g.visible=near&&G.vis>.02; if(!G.g.visible) continue;
    G.g.position.y=waveH(G.pos.x,G.pos.z,t);
    G.arcs.forEach((a,k)=>{ a.rotation.z=t*(1.4+k*.5)*(k%2?-1:1)+G.ph; a.material.opacity=.75*G.vis; a.position.y=1.2+k*.5+Math.sin(t*2+k+G.ph)*.15; });
    G.glow.material.opacity=.3*G.vis;
    if(G.cd<=0 && started && Math.hypot(G.pos.x-boat.pos.x,G.pos.z-boat.pos.z)<3.6){
      G.cd=22; boat.boost=BOOST_TIME; sfx.gust(); shake=Math.max(shake,.25);
      boat.vel.x+=fx*4; boat.vel.z+=fz*4;
      for(let i=0;i<10;i++) spray(G.pos.x+R(-1,1),G.pos.z+R(-1,1),R(-3,3),R(-3,3),R(3,6),.5);
    }
  }
  if(boosting && Math.random()<dt*40){
    const S=streaks[streakIdx++%streaks.length]; const ox=R(-5,5), oz=R(4,12), oy=R(.8,3.2);
    S.m.position.set(boat.pos.x+fx*oz+rx*ox,wy+oy,boat.pos.z+fz*oz+rz*ox); S.m.rotation.set(-Math.PI/2,0,-boat.heading); S.m.rotateX(0); S.life=.45; S.m.visible=true;
  }
  for(const S of streaks){ if(S.life<=0) continue; S.life-=dt; S.m.material.opacity=Math.sin(Math.max(0,S.life)/.45*Math.PI)*.7; if(S.life<=0) S.m.visible=false; }

  // ---------- fishing spots (only animate the ones near you)
  nearSpot=null; let best=7;
  for(const s of spots){
    if(s.cd>0){ s.cd-=dt; }
    const active=s.cd<=0;
    const d=Math.hypot(boat.pos.x-s.pos.x,boat.pos.z-s.pos.z);
    if(active && d<best){ best=d; nearSpot=s; }
    s.g.visible=d<95; if(!s.g.visible) continue;
    s.vis=damp(s.vis,active?1:0,2,dt);
    const wh=waveH(s.pos.x,s.pos.z,t);
    s.rings.forEach((r,k)=>{ const ph=((t*.45+k/3+s.phase)%1); r.scale.setScalar(.6+ph*2.6); r.position.y=wh+.06; r.material.opacity=(1-ph)*.55*s.vis; });
    s.fish.forEach((f,k)=>{
      f.a+=f.sp*dt; let x=Math.cos(f.a)*f.r, z=Math.sin(f.a)*f.r;
      const hooked=k===0 && fish.spot===s && !fish.noBite && (fish.state==='waiting'||fish.state==='bite'||fish.state==='between');
      f.m.scale.x=damp(f.m.scale.x,hooked?.8*(1+TIERS[fish.sp.tier].rank*.3):.8,3,dt); f.m.scale.z=f.m.scale.x*2.6;
      if(hooked){
        const bx=fish.bob.x-s.pos.x, bz=fish.bob.z-s.pos.z, u=Math.min(1,fish.t/Math.max(.5,fish.dur||1));
        const near=fish.state!=='waiting'; x=lerp(x,bx-.6,near?1:u*.85); z=lerp(z,bz-.6,near?1:u*.85);
      }
      const px=f.m.position.x, pz=f.m.position.z;
      f.m.position.set(damp(px,x,5,dt),wh+.04,damp(pz,z,5,dt));
      const vx=f.m.position.x-px, vz=f.m.position.z-pz; if(Math.abs(vx)+Math.abs(vz)>1e-4) f.m.rotation.y=Math.atan2(vx,vz);
      f.m.material.opacity=.55*s.vis;
    });
  }
  if(started && fish.state==='idle'){
    const want = nearSpot && vf<9 && !ashore ? 'cast':'hidden';
    if(castBtn.dataset.mode!==want) setBtn(want);
  }
  updateFishing(dt,t);
  if(catchTimer>0){ catchTimer-=dt; if(catchTimer<=0) $('catch').classList.add('hidden'); }

  // ---------- ambient life
  for(const b of birds){ const a=b.ph+t*b.sp; b.g.position.set(b.cx+Math.cos(a)*b.rad,b.h+Math.sin(t*.7+b.ph)*.6,b.cz+Math.sin(a)*b.rad); b.g.rotation.y=-a; b.g.rotation.z=-.25;
    const fl=Math.sin(t*7+b.ph)*.45; b.wl.rotation.z=fl; b.wr.rotation.z=-fl; }
  if(ISL.lantern.lamp) ISL.lantern.lamp.material.emissiveIntensity=(1.0+Math.sin(t*2)*.4)*(1+nightK*1.5);
  FLAMES.forEach((f,i)=>{ f.scale.y=1+Math.sin(t*12+i*2)*.18; f.scale.x=f.scale.z=1+Math.sin(t*9+i)*.1; });
  FLAGS.forEach((f,i)=>{ f.rotation.y=Math.sin(t*5+i)*.35; });
  BOBBERS.forEach((b,i)=>{ b.position.y=waveH(b.position.x,b.position.z,t)-.05; b.rotation.z=Math.sin(t*1.4+i)*.06; });

  // ---------- audio follows speed
  if(rush){ const k=clamp(Math.abs(vf)/MAX_SPEED,0,1.6); rush.g.gain.setTargetAtTime(muted?0:.02+k*k*.16+boostF*.08,ac.currentTime,.15); rush.f.frequency.setTargetAtTime(350+k*900+boostF*500,ac.currentTime,.2); }

  const cell=WATER_SIZE/WATER_SEG;
  water.position.set(Math.round(boat.pos.x/cell)*cell,0,Math.round(boat.pos.z/cell)*cell);

  placeCamera(false,dt);
  updateUI(dt); shellTick(dt); updateActions(dt); updateDay(dt,t); updateBottles(dt,t);
  saveT-=dt; if(saveT<=0){ saveT=10; save.ph=dayPh; persist(); }
  sun.position.copy(boat.pos).add(SUN_OFF); sun.target.position.copy(boat.pos);

  renderer.setRenderTarget(rt); renderer.render(scene,camera);
  renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener('resize',()=>{
  renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(dbs); rt.setSize(dbs.x,dbs.y); postMat.uniforms.uRes.value.copy(dbs); setBlur();
});
window.__dw={walker,getOut,getIn,findAction:()=>findAction(),INTERACT,doInteract,setPh:v=>{dayPh=v;},bottles,NOTES,boat,fish,spots,begin,keys,FISH,TIERS,GUSTS,ISL,save,toggleShop,showDetail,toggleJournal,renderShop,setTab:t=>{shopTab=t;renderShop();},renderer,snap:()=>placeCamera(true,0)};
</script>
</body>
